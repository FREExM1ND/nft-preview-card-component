<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <main class="card">
      <img
        src="./images/image-equilibrium.jpg"
        alt="Equilibrium NFT image"
        class="card__nft-image"
      />
      <h1 class="card__heading">Equilibrium #3429</h1>
      <p class="card__description">
        Our Equilibrium collection promotes balance and calm.
      </p>
      <div class="card__details">
        <div class="stats">
          <div class="stats__price">
            <img
              src="./images/icon-ethereum.svg"
              alt=""
              aria-hidden="true"
              class="icon-ethereum"
            />
            <p class="stats__price-rate">0.041 ETH</p>
          </div>
          <div class="stats__clock">
            <img
              src="./images/icon-clock.svg"
              alt=""
              aria-hidden="true"
              class="icon-clock"
            />
            <p class="stats__clock-time">3 days left</p>
          </div>
        </div>
        <div class="creator">
          <img
            src="./images/image-avatar.png"
            alt=""
            aria-hidden="true"
            class="creator__avatar"
          />Creation of
          <p class="creator__name">Jules Wyvern</p>
        </div>
      </div>
    </main>
    <footer class="credits">
      Challenge by
      <a
        href="https://www.frontendmentor.io/challenges/nft-preview-card-component-SbdUL_w0U"
        >Frontend Mentor</a
      >. Coded by <a href="https://github.com/FREExM1ND">Aaron Robbins</a>.
    </footer>
  </body>
</html>
